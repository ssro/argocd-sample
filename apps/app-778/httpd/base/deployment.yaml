apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-778
  labels:
    app: app-778
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-778
  template:
    metadata:
      labels:
        app: app-778
    spec:
      containers:
      - name: web
        image: httpd
        ports:
        - containerPort: 80
