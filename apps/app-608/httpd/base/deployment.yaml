apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-608
  labels:
    app: app-608
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-608
  template:
    metadata:
      labels:
        app: app-608
    spec:
      containers:
      - name: web
        image: httpd
        ports:
        - containerPort: 80
