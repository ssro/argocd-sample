apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-752
  labels:
    app: app-752
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-752
  template:
    metadata:
      labels:
        app: app-752
    spec:
      containers:
      - name: web
        image: httpd
        ports:
        - containerPort: 80
