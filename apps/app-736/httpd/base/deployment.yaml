apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-736
  labels:
    app: app-736
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-736
  template:
    metadata:
      labels:
        app: app-736
    spec:
      containers:
      - name: web
        image: httpd
        ports:
        - containerPort: 80
