apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-999
  labels:
    app: app-999
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-999
  template:
    metadata:
      labels:
        app: app-999
    spec:
      containers:
      - name: web
        image: httpd
        ports:
        - containerPort: 80
