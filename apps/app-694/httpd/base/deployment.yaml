apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-694
  labels:
    app: app-694
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-694
  template:
    metadata:
      labels:
        app: app-694
    spec:
      containers:
      - name: web
        image: httpd
        ports:
        - containerPort: 80
